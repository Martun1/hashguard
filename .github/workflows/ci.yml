name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Attack simulation must be detected (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 demo/simulate_attack.py setup
          ./build/hashguard init demo/webroot --no-color
          python3 demo/simulate_attack.py attack
          ./build/hashguard check demo/webroot --no-color || test $? -eq 2
